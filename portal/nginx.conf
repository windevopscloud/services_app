server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.amazoncognito.com; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
