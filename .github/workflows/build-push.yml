name: build-push

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to EKS after build?"
        type: choice
        options: ["no", "yes"]
        default: "no"
  push:
    branches: [main]
    paths: ["services/**", "portal/**"]

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  ENVIRONMENT: poc
  SERVICES: "intsvc1 intsvc2 intsvc3 intsvc4 corpsvc1 corpsvc2 extsvc1 extsvc2"

jobs:
  build:
    runs-on: services_app-runner-poc
    steps:
      - uses: actions/checkout@v6

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build once, push to each service repo
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "local-services:${TAG}" services/
          for SVC in $SERVICES; do
            docker tag "local-services:${TAG}" "${REGISTRY}/${SVC}:${TAG}"
            docker push "${REGISTRY}/${SVC}:${TAG}"
          done
          echo "Pushed ${TAG} to: ${SERVICES}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build portal, push to portal-ext and portal-corp
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "local-portal:${TAG}" portal/
          for P in portal-ext portal-corp; do
            docker tag "local-portal:${TAG}" "${REGISTRY}/${P}:${TAG}"
            docker push "${REGISTRY}/${P}:${TAG}"
          done
          echo "Pushed ${TAG} to: portal-ext portal-corp" >> "$GITHUB_STEP_SUMMARY"

      - name: Docker logout
        if: always()
        run: docker logout "$REGISTRY" || true

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes'
    runs-on: services_app-runner-poc
    steps:
      - uses: actions/checkout@v6

      - name: Fill tokens and upload bundle
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          TAG="${GITHUB_SHA::7}"
          sed -i "s|__REGISTRY__|${REGISTRY}|g; s|__IMAGE_TAG__|${TAG}|g" k8s/service.tmpl.yaml k8s/portal.tmpl.yaml
          ssm() { aws ssm get-parameter --name "/${ENVIRONMENT}/cognito/$1" --query Parameter.Value --output text; }
          EXT_CLIENT_ID=$(ssm ext/web-client-id)
          EXT_DOMAIN=$(ssm ext/domain)
          CORP_CLIENT_ID=$(ssm corp/web-client-id)
          CORP_DOMAIN=$(ssm corp/domain)
          printf 'EXT_CLIENT_ID=%s\nEXT_DOMAIN=%s\nCORP_CLIENT_ID=%s\nCORP_DOMAIN=%s\n' \
            "$EXT_CLIENT_ID" "$EXT_DOMAIN" "$CORP_CLIENT_ID" "$CORP_DOMAIN" > deploy/portal.env
          BUCKET="bundles-${ACCOUNT_ID}-${ENVIRONMENT}"
          KEY="releases/services-app/${TAG}-${GITHUB_RUN_NUMBER}.tgz"
          echo "BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          echo "KEY=${KEY}" >> "$GITHUB_ENV"
          tar czf bundle.tgz k8s deploy
          aws s3 cp bundle.tgz "s3://${BUCKET}/${KEY}"

      - name: Run deploy on tools EC2
        run: |
          cat > params.json <<EOF2
          {"commands":[
            "set -e",
            "rm -rf /tmp/bundle && mkdir -p /tmp/bundle",
            "aws s3 cp s3://${BUCKET}/${KEY} /tmp/bundle/b.tgz --region ${AWS_REGION}",
            "tar xzf /tmp/bundle/b.tgz -C /tmp/bundle",
            "cd /tmp/bundle && bash deploy/apply.sh"
          ]}
          EOF2
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=eks_tools-${ENVIRONMENT}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "CommandId: $CMD_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" --query "CommandInvocations[0].Status" --output text)
            echo "Status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$CMD_ID" --query "CommandInvocations[0].InstanceId" --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "[StandardOutputContent,StandardErrorContent]" --output text
          [ "$STATUS" = "Success" ]
