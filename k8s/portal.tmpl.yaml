apiVersion: v1
kind: ServiceAccount
metadata: { name: portal-__P__, namespace: apps }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: portal-__P__, namespace: apps, labels: { app: portal-__P__ } }
spec:
  replicas: 1
  selector: { matchLabels: { app: portal-__P__ } }
  template:
    metadata:
      labels: { app: portal-__P__, version: v1 }
      annotations:
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyMemory: 64Mi
    spec:
      serviceAccountName: portal-__P__
      containers:
      - name: nginx
        image: __REGISTRY__/portal-__P__:__IMAGE_TAG__
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { cpu: 200m, memory: 96Mi }
        readinessProbe:
          httpGet: { path: /index.html, port: 8080 }
        volumeMounts:
        - { name: config, mountPath: /usr/share/nginx/html/config.js, subPath: config.js }
      volumes:
      - name: config
        configMap: { name: portal-__P__-config }
---
apiVersion: v1
kind: Service
metadata: { name: portal-__P__, namespace: apps }
spec:
  selector: { app: portal-__P__ }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
