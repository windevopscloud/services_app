apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: extsvc-routes, namespace: apps }
spec:
  hosts: ["extsvc.windevopscloud.com"]
  gateways: ["istio-ingress-ext/ext-gw"]
  http:
  - match: [{ uri: { prefix: /api/extsvc1 } }]
    rewrite: { uri: / }
    headers: { request: { set: { x-origin: ext } } }
    route: [{ destination: { host: extsvc1, port: { number: 8080 } } }]
  - match: [{ uri: { prefix: /api/extsvc2 } }]
    rewrite: { uri: / }
    headers: { request: { set: { x-origin: ext } } }
    route: [{ destination: { host: extsvc2, port: { number: 8080 } } }]
  - route: [{ destination: { host: portal-ext, port: { number: 8080 } } }]
---
