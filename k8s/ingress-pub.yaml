# Public ALB for extsvc.windevopscloud.com -> ingress-pub gateway pods (HTTPS to the pod, self-signed, ALB does not verify).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: extsvc
  namespace: istio-ingress-pub
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: poc-extsvc-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: __EXTSVC_CERT_ARN__
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "15021"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/tags: Environment=poc
spec:
  ingressClassName: alb
  rules:
    - host: extsvc.windevopscloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-pub
                port:
                  number: 443
