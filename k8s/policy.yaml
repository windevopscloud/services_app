# Mesh policy for the apps namespace.
# 1) mTLS is mandatory between workloads.
# 2) Every workload only accepts calls from the identities listed below (default deny).
# Identity = Kubernetes service account, shown to Istio as cluster.local/ns/<namespace>/sa/<name>.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: default, namespace: apps }
spec:
  mtls: { mode: STRICT }
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: allow-portal-ext, namespace: apps }
spec:
  selector: { matchLabels: { app: portal-ext } }
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/istio-ingress-ext/sa/ingress-ext"
    to:
    - operation:
        methods: ["GET", "HEAD"]
---
