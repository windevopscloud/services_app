# extsvc is public (ALB), so it must only accept requests that carry a valid Cognito token
# issued to the calling service (client credentials). Checked at the ingress-pub gateway.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: extsvc-jwt, namespace: istio-ingress-pub }
spec:
  selector: { matchLabels: { istio: ingress-pub } }
  jwtRules:
  - issuer: "__EXT_ISSUER__"
    jwks: '__EXT_JWKS__'
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: extsvc-require-token, namespace: istio-ingress-pub }
spec:
  selector: { matchLabels: { istio: ingress-pub } }
  action: ALLOW
  rules:
  - to:
    - operation: { paths: ["/api/extsvc1", "/api/extsvc1/*"] }
    when:
    - { key: "request.auth.claims[scope]", values: ["ext-api/extsvc1.invoke"] }
  - to:
    - operation: { paths: ["/api/extsvc2", "/api/extsvc2/*"] }
    when:
    - { key: "request.auth.claims[scope]", values: ["ext-api/extsvc2.invoke"] }
