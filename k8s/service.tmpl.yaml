apiVersion: v1
kind: ServiceAccount
metadata: { name: __NAME__, namespace: apps }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: __NAME__, namespace: apps, labels: { app: __NAME__ } }
spec:
  replicas: 1
  selector: { matchLabels: { app: __NAME__ } }
  template:
    metadata:
      labels: { app: __NAME__, version: v1 }
      annotations:
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyMemory: 64Mi
    spec:
      serviceAccountName: __NAME__
      containers:
      - name: app
        image: __REGISTRY__/__NAME__:__IMAGE_TAG__
        ports: [{ containerPort: 8080 }]
        env:
        - { name: SERVICE, value: __NAME__ }
        - { name: DOWNSTREAM, value: "__DOWNSTREAM__" }
        envFrom:
        - secretRef: { name: client-__NAME__, optional: true }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
        securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: __NAME__, namespace: apps }
spec:
  selector: { app: __NAME__ }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
